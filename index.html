<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สแกนราคาอาหาร</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f4;--card:#fff;--tx:#1d2420;--mu:#6b756f;--ac:#2f7d57;--bd:#dfe4de;--bad:#c0392b;--ok:#2f7d57}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141815;--card:#1d241f;--tx:#e8ede9;--mu:#98a39c;--ac:#4fb383;--bd:#2c362f;--bad:#ef7b6d;--ok:#4fb383}}
:root[data-theme="dark"]{--bg:#141815;--card:#1d241f;--tx:#e8ede9;--mu:#98a39c;--ac:#4fb383;--bd:#2c362f;--bad:#ef7b6d;--ok:#4fb383}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Thai",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 14px}
h2{font-size:15px;margin:0 0 10px;color:var(--mu);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}
button{padding:11px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer;width:100%;margin-top:10px}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button.x{width:auto;margin:0;padding:4px 10px;background:transparent;color:var(--mu);border:1px solid var(--bd)}
video{width:100%;border-radius:12px;background:#000;margin-top:10px;max-height:260px;object-fit:cover}
.hide{display:none}
.msg{margin-top:10px;font-weight:600}
.bad{color:var(--bad)}.ok{color:var(--ok)}.mu{color:var(--mu);font-size:13px;font-weight:400}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.item:first-of-type{border-top:0}
.lk{margin-top:10px}.lk a{display:inline-block;margin:6px 6px 0 0;padding:7px 12px;border:1px solid var(--ac);border-radius:999px;color:var(--ac);text-decoration:none;font-size:14px;font-weight:600}
.tot{font-size:22px;font-weight:700}
</style>
</head>
<body>
<main>
<h1>🛒 สแกนราคาอาหาร</h1>

<div class="card">
<h2>สแกนบาร์โค้ด</h2>
<button id="scanBtn">📷 เปิดกล้องสแกน</button>
<video id="vid" class="hide" playsinline muted></video>
<label>หรือพิมพ์เลขบาร์โค้ด</label>
<div class="row"><input id="code" inputmode="numeric" placeholder="เช่น 8850999320113"><button class="sec" id="findBtn" style="margin:0;flex:0 0 90px">ค้นหา</button></div>
<div id="info" class="msg"></div>
<div id="links" class="hide"></div>
</div>

<div class="card">
<h2>บันทึกรายการ</h2>
<button class="sec" id="ocrBtn" style="margin-top:0">📸 ถ่ายรูปป้ายราคา</button>
<input type="file" id="ocrFile" accept="image/*" capture="environment" class="hide">
<div id="ocrMsg" class="mu" style="margin-top:6px"></div>
<label>ชื่อสินค้า</label><input id="name" placeholder="ชื่อสินค้า">
<div class="row">
<div><label>ราคามาตรฐาน (บาท)</label><input id="std" type="number" inputmode="decimal" step="0.01"></div>
<div><label>ราคาที่จ่ายจริง</label><input id="paid" type="number" inputmode="decimal" step="0.01"></div>
<div><label>จำนวน</label><input id="qty" type="number" inputmode="numeric" value="1" min="1"></div>
</div>
<div id="cmp" class="msg"></div>
<button id="saveBtn">บันทึก</button>
<div class="mu" style="margin-top:8px">ถ้าสินค้าใหม่ ใส่ราคามาตรฐานครั้งแรก แอปจะจำไว้ให้สแกนครั้งต่อไป</div>
</div>

<div class="card">
<h2>รายการที่จดไว้</h2>
<div class="tot" id="total">฿0</div>
<div class="mu" id="saving"></div>
<div id="list"></div>
<button class="sec" id="clearBtn">ล้างรายการ</button>
</div>
</main>

<script>
const $=id=>document.getElementById(id);
const S={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let prods=S.get('prods',{}),log=S.get('log',[]),stream=null,zx=null;
const fmt=n=>'฿'+(Math.round(n*100)/100).toLocaleString('th-TH');

async function lookup(c){
  c=c.trim();if(!c)return;
  $('code').value=c;
  const p=prods[c];
  if(p){$('name').value=p.name;$('std').value=p.std;$('paid').value=p.std;$('info').innerHTML='<span class="ok">พบสินค้า: '+esc(p.name)+' · มาตรฐาน '+fmt(p.std)+'</span>';compare();return}
  $('name').value='';$('std').value='';$('paid').value='';
  $('info').innerHTML='<span class="mu">กำลังค้นหาออนไลน์...</span>';compare();
  let name='',price=null,n=0;
  try{
    const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(c)+'.json?fields=product_name,brands');
    const j=await r.json();
    if(j.status===1&&j.product){name=[j.product.product_name,j.product.brands].filter(Boolean).join(' · ')}
  }catch(e){}
  try{
    const r=await fetch('https://prices.openfoodfacts.org/api/v1/prices?product_code='+encodeURIComponent(c)+'&currency=THB&order_by=-date&size=20');
    const j=await r.json();
    const a=(j.items||[]).map(x=>Number(x.price)).filter(x=>x>0).sort((x,y)=>x-y);
    n=a.length;
    if(n)price=a[Math.floor((n-1)/2)];
  }catch(e){}
  if($('code').value.trim()!==c)return;
  if(name)$('name').value=name;
  if(price!==null){$('std').value=price;$('paid').value=price}
  let m=[];
  if(name)m.push('พบชื่อสินค้า');
  if(price!==null)m.push('ราคากลางจาก Open Prices '+fmt(price)+' ('+n+' รายการล่าสุด)');
  $('info').innerHTML=m.length?'<span class="ok">'+m.join(' · ')+'</span>'+(price===null?'<div class="mu">ยังไม่มีข้อมูลราคาในไทย กรอกราคามาตรฐานเอง</div>':''):'<span class="mu">ไม่พบสินค้านี้ออนไลน์ กรอกชื่อและราคามาตรฐานด้านล่าง</span>';
  compare();
}
function updateLinks(){
  const c=$('code').value.trim(),n=$('name').value.trim(),q=n||c;
  if(!q){$('links').className='hide';return}
  const g=t=>'https://www.google.com/search?q='+encodeURIComponent(t);
  const L=[];
  if(c)L.push(['Google (บาร์โค้ด)',g(c+' ราคา')]);
  L.push(['Lotus\'s',g(q+' ราคา site:lotuss.com')],['Big C',g(q+' ราคา site:bigc.co.th')],['Makro',g(q+' ราคา site:makro.pro')]);
  $('links').className='lk';
  $('links').innerHTML='<div class="mu">เช็กราคาออนไลน์ (เปิดในแท็บใหม่):</div>'+L.map(x=>'<a href="'+x[1]+'" target="_blank" rel="noopener">'+x[0]+'</a>').join('');
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function compare(){
  updateLinks();
  const s=parseFloat($('std').value),p=parseFloat($('paid').value);
  if(isNaN(s)||isNaN(p)){$('cmp').textContent='';return}
  const d=p-s;
  $('cmp').className='msg '+(d>0?'bad':'ok');
  $('cmp').textContent=d>0?'แพงกว่ามาตรฐาน '+fmt(d):d<0?'ถูกกว่ามาตรฐาน '+fmt(-d):'ตรงตามราคามาตรฐาน';
}
['std','paid'].forEach(i=>$(i).addEventListener('input',compare));
$('name').addEventListener('input',updateLinks);$('code').addEventListener('input',updateLinks);
$('findBtn').onclick=()=>lookup($('code').value);
$('code').addEventListener('keydown',e=>{if(e.key==='Enter')lookup($('code').value)});

function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(zx){try{zx.reset()}catch(e){}zx=null}$('vid').classList.add('hide');$('scanBtn').textContent='📷 เปิดกล้องสแกน'}
function loadZX(){return new Promise((ok,no)=>{if(window.ZXing)return ok();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
$('scanBtn').onclick=async()=>{
  if(stream||zx){stop();return}
  const v=$('vid');
  try{
    if('BarcodeDetector' in window){
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      v.srcObject=stream;v.classList.remove('hide');await v.play();
      $('scanBtn').textContent='⏹ หยุดสแกน';
      const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
      const tick=async()=>{
        if(!stream)return;
        try{const r=await det.detect(v);if(r.length){const c=r[0].rawValue;stop();lookup(c);return}}catch(e){}
        setTimeout(tick,300)};
      tick();
    }else{
      await loadZX();
      v.classList.remove('hide');$('scanBtn').textContent='⏹ หยุดสแกน';
      zx=new ZXing.BrowserMultiFormatReader();
      zx.decodeFromVideoDevice(null,v,(r)=>{if(r){const c=r.getText();stop();lookup(c)}});
    }
  }catch(e){stop();$('info').innerHTML='<span class="bad">เปิดกล้องไม่ได้ ลองอนุญาตกล้องหรือพิมพ์เลขบาร์โค้ดแทน</span>'}
};

function loadTes(){return new Promise((ok,no)=>{if(window.Tesseract)return ok();const t=document.createElement('script');t.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';t.onload=ok;t.onerror=no;document.head.appendChild(t)})}
$('ocrBtn').onclick=()=>$('ocrFile').click();
$('ocrFile').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const m=$('ocrMsg');m.textContent='กำลังโหลดตัวอ่านข้อความ (ครั้งแรกอาจใช้เวลาสักครู่)...';
  try{
    await loadTes();
    const r=await Tesseract.recognize(f,'tha+eng',{logger:x=>{if(x.status==='recognizing text')m.textContent='กำลังอ่านรูป '+Math.round(x.progress*100)+'%'}});
    parseTag(r.data.text||'');
  }catch(err){m.innerHTML='<span class="bad">อ่านรูปไม่สำเร็จ ลองถ่ายใหม่ให้ชัดขึ้น หรือกรอกเอง</span>'}
  e.target.value='';
};
function parseTag(raw){
  const text=raw.replace(/(\d),(\d{3})/g,'$1$2').replace(/(\d),(\d{1,2})\b/g,'$1.$2');
  let price=null,mm=text.match(/(\d{1,4}(?:\.\d{1,2})?)\s*(?:บาท|฿)/)||text.match(/฿\s*(\d{1,4}(?:\.\d{1,2})?)/)||text.match(/\b(\d{1,4}\.\d{2})\b/);
  if(mm)price=parseFloat(mm[1]);
  let name='',best=0;
  text.split('\n').map(l=>l.trim()).forEach(l=>{
    const letters=(l.match(/[\u0E00-\u0E7Fa-zA-Z]/g)||[]).length;
    if(l.length>=4&&l.length<=70&&letters/l.length>0.6&&!/บาท|ราคา|บาร์โค้ด/.test(l)&&letters>best){best=letters;name=l}
  });
  const filled=[];
  if(name&&!$('name').value.trim()){$('name').value=name;filled.push('ชื่อ')}
  if(price!==null){
    if(!$('std').value){$('std').value=price;filled.push('ราคามาตรฐาน')}
    if(!$('paid').value){$('paid').value=price;filled.push('ราคาที่จ่าย')}
  }
  compare();
  $('ocrMsg').innerHTML=(filled.length?'<span class="ok">เติมให้แล้ว: '+filled.join(', ')+' · กรุณาตรวจสอบก่อนบันทึก</span>':'<span class="bad">อ่านชื่อ/ราคาไม่ได้ ลองถ่ายใหม่ให้ใกล้และตรงขึ้น</span>')+'<details><summary>ข้อความที่อ่านได้</summary><pre style="white-space:pre-wrap;font-size:12px">'+esc(raw)+'</pre></details>';
}
$('saveBtn').onclick=()=>{
  const code=$('code').value.trim()||('manual-'+Date.now()),name=$('name').value.trim(),std=parseFloat($('std').value),paid=parseFloat($('paid').value),qty=Math.max(1,parseInt($('qty').value)||1);
  if(!name||isNaN(paid)){$('cmp').className='msg bad';$('cmp').textContent='กรอกชื่อสินค้าและราคาที่จ่ายก่อน';return}
  const s=isNaN(std)?paid:std;
  prods[code]={name,std:s};S.set('prods',prods);
  log.unshift({t:Date.now(),code,name,std:s,paid,qty});S.set('log',log);
  $('code').value='';$('name').value='';$('std').value='';$('paid').value='';$('qty').value=1;$('cmp').textContent='';$('info').innerHTML='<span class="ok">บันทึกแล้ว ✓</span>';
  render();
};
function render(){
  let tot=0,save=0;
  $('list').innerHTML=log.map((x,i)=>{tot+=x.paid*x.qty;save+=(x.std-x.paid)*x.qty;
    const d=x.paid-x.std;
    return '<div class="item"><div><b>'+esc(x.name)+'</b> × '+x.qty+'<div class="mu">'+new Date(x.t).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'})+' · มาตรฐาน '+fmt(x.std)+' · จ่าย '+fmt(x.paid)+(d?' <span class="'+(d>0?'bad':'ok')+'">('+(d>0?'+':'')+fmt(d)+')</span>':'')+'</div></div><button class="x" data-i="'+i+'">ลบ</button></div>'}).join('')||'<div class="mu">ยังไม่มีรายการ</div>';
  $('total').textContent=fmt(tot);
  $('saving').textContent=log.length?(save>=0?'ประหยัดกว่ามาตรฐานรวม '+fmt(save):'จ่ายแพงกว่ามาตรฐานรวม '+fmt(-save)):'';
}
$('list').onclick=e=>{const i=e.target.dataset.i;if(i!==undefined){log.splice(+i,1);S.set('log',log);render()}};
$('clearBtn').onclick=()=>{if(log.length&&confirm('ล้างรายการทั้งหมด?')){log=[];S.set('log',log);render()}};
render();
</script>
</body>
</html>
